name: Godot Vulkan terrain shader validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/terrain-vulkan-validation.yml'
      - 'tools/csharp-runner/Program.cs'
      - 'scripts/csharp/terrain/**'
      - 'scripts/csharp/caves/**'
      - 'config/caves/**'
      - 'shaders/**'
      - 'tools/csharp/TerrainGpu*'
      - 'tools/csharp/CaveGpu*'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/terrain-vulkan-validation.yml'
      - 'tools/csharp-runner/Program.cs'
      - 'scripts/csharp/terrain/**'
      - 'scripts/csharp/caves/**'
      - 'config/caves/**'
      - 'shaders/**'
      - 'tools/csharp/TerrainGpu*'
      - 'tools/csharp/CaveGpu*'
  workflow_dispatch:

concurrency:
  group: terrain-vulkan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vulkan:
    name: ${{ matrix.method }} (Mesa Vulkan)
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    strategy:
      fail-fast: false
      # Software Vulkan reserves several GiB. Avoid concurrent OOM on hosted VMs.
      max-parallel: 1
      matrix:
        method: [forward_plus, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Use portable NuGet sources
        run: |
          cat > NuGet.Config <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          XML
      - name: Install native tools and software Vulkan driver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip xvfb libvulkan1 mesa-vulkan-drivers vulkan-tools
          mkdir -p .tools/godot-ci
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_mono_linux_x86_64.zip' \
            --output "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d .tools/godot-ci
          ENGINE="$(find .tools/godot-ci -type f -name 'Godot_v4.6.1-stable_mono_linux.x86_64' -print -quit)"
          test -n "$ENGINE"
          chmod +x "$ENGINE"
          echo "GODOT_BIN=$GITHUB_WORKSPACE/$ENGINE" >> "$GITHUB_ENV"
          ICD="$(find /usr/share/vulkan/icd.d -type f -name 'lvp_icd*.json' | head -n 1)"
          test -n "$ICD"
          echo "VK_DRIVER_FILES=$ICD" >> "$GITHUB_ENV"
      - name: Restore and build game and tests
        run: |
          dotnet restore PredatorIsle.csproj --nologo
          dotnet build PredatorIsle.csproj --no-restore --configuration Debug --nologo -warnaserror
          dotnet build tools/csharp-runner/PredatorIsle.Checks.csproj --configuration Debug --nologo -warnaserror
      - name: Godot .NET project import
        run: '"$GODOT_BIN" --headless --editor --path . --import --quit'
      - name: Confirm software Vulkan device
        run: |
          xvfb-run -a vulkaninfo --summary | head -n 100
      - name: Validate all-biome materials, cave shaders, and GPU collision
        timeout-minutes: 24
        env:
          PREDATOR_ISLE_TEST_RENDER_METHOD: ${{ matrix.method }}
          PREDATOR_ISLE_TEST_DUMMY_AUDIO: '1'
          PREDATOR_ISLE_TEST_MEMORY_MIB: '5120'
          LIBGL_ALWAYS_SOFTWARE: '1'
          LP_NUM_THREADS: '2'
        run: |
          # Bound Godot's shader compiler pool as well as Mesa's worker count.
          # This override exists only for checks; production settings are intact.
          test ! -e override.cfg
          trap 'rm -f override.cfg' EXIT
          cat > override.cfg <<'CFG'
          [threading]
          worker_pool/max_threads=2
          CFG
          if [ "$PREDATOR_ISLE_TEST_RENDER_METHOD" = "mobile" ]; then
            # The 3,504-point sampler fixture exceeded the software Mobile
            # driver's 120-second first-compile timeout. The focused actual
            # GPU heightmap, CPU-reference and Jolt test passed in that run.
            echo "::notice::Software Mobile: run focused GPU collision and explicit vertex-fallback checks; comprehensive 3,504-point sampler remains unverified."
            xvfb-run -a dotnet run --project tools/csharp-runner/PredatorIsle.Checks.csproj --no-build -- \
              gpu-vertex gpu-extension gpu-materials gpu-caves gpu-terrain \
              gpu-cave-scene-0 gpu-cave-scene-1 gpu-cave-scene-2 gpu-cave-scene-3 \
              gpu-cave-scene-4 gpu-cave-scene-5 gpu-cave-scene-6 gpu-cave-scene-7
          else
            xvfb-run -a dotnet run --project tools/csharp-runner/PredatorIsle.Checks.csproj --no-build -- \
              gpu-sampler gpu-vertex gpu-extension gpu-materials gpu-caves gpu-terrain \
              gpu-cave-scene-0 gpu-cave-scene-1 gpu-cave-scene-2 gpu-cave-scene-3 \
              gpu-cave-scene-4 gpu-cave-scene-5 gpu-cave-scene-6 gpu-cave-scene-7
          fi
      - name: Upload semantic and renderer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terrain-vulkan-${{ matrix.method }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            data/csharp_check_*_latest.json
            data/csharp_runner_latest.json
            .godot/csharp_checks/**/receipt.json
            .godot/csharp_checks/**/*.log

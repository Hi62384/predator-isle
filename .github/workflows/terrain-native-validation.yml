name: Godot terrain and cave native validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/terrain-native-validation.yml'
      # Native regression coverage includes every live biome, cave, blob,
      # terrain, shader, scene and registered world/resource configuration.
      - 'scripts/csharp/**'
      - 'scripts/*.gd'
      - 'shaders/**'
      - 'config/**'
      - 'scenes/**'
      - 'tools/csharp/**'
      - 'tools/csharp-runner/**'
  workflow_dispatch:

concurrency:
  group: terrain-native-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Godot 4.6.1 .NET CPU and Compatibility GPU regression
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install source-independent NuGet configuration
        run: |
          cat > NuGet.Config <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          XML
      - name: Install Godot 4.6.1 .NET for Linux
        run: |
          mkdir -p .tools/godot-ci
          if ! find .tools/godot-ci -type f -name 'Godot_v4.6.1-stable_mono_linux.x86_64' -print -quit | grep -q .; then
            curl --fail --location --retry 3 --retry-delay 2 \
              'https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_mono_linux_x86_64.zip' \
              --output "$RUNNER_TEMP/godot.zip"
            unzip -q "$RUNNER_TEMP/godot.zip" -d .tools/godot-ci
          fi
          ENGINE="$(find .tools/godot-ci -type f -name 'Godot_v4.6.1-stable_mono_linux.x86_64' -print -quit)"
          test -n "$ENGINE"
          chmod +x "$ENGINE"
          echo "GODOT_BIN=$GITHUB_WORKSPACE/$ENGINE" >> "$GITHUB_ENV"
      - name: Restore and compile the runtime
        run: |
          dotnet restore PredatorIsle.csproj --nologo
          dotnet build PredatorIsle.csproj --no-restore --configuration Debug --nologo -warnaserror
          dotnet build tools/csharp-runner/PredatorIsle.Checks.csproj --configuration Debug --nologo -warnaserror
      - name: Import Godot resources
        timeout-minutes: 8
        run: |
          "$GODOT_BIN" --headless --editor --path . --import --quit
      - name: Verify short-lived process exit sampling in the check launcher
        timeout-minutes: 2
        run: dotnet run --project tools/csharp-runner/PredatorIsle.Checks.csproj --no-build -- runner-race
      - name: Verify all extension-biome numerical generators before slow world checks
        timeout-minutes: 9
        run: |
          dotnet run --project tools/csharp-runner/PredatorIsle.Checks.csproj --no-build -- samplers
      - name: Verify authoritative numerical and collision paths
        timeout-minutes: 12
        run: |
          dotnet run --project tools/csharp-runner/PredatorIsle.Checks.csproj --no-build -- \
            quarry rings sampling gpu-pipeline collision network discovery
      - name: Verify all primary cave biome and terrain-specific paths
        timeout-minutes: 13
        run: |
          dotnet run --project tools/csharp-runner/PredatorIsle.Checks.csproj --no-build -- \
            field worker tropical beach placement tissue cave-biomes
      - name: Verify GPU visual payloads and collision for each biome in an isolated engine process
        timeout-minutes: 15
        run: |
          set -e
          for biome in grass forest savanna swamp jungle mountain tropical badlands quarry wise_mountains volcanic spore_forest radiation_wasteland crystal_wastes insect_colony alien_infected; do
            echo "::group::GPU visual and physics: $biome"
            dotnet run --project tools/csharp-runner/PredatorIsle.Checks.csproj --no-build -- "gpu-biome-$biome"
            echo "::endgroup::"
          done
      - name: Measure direct terrain generation and memory allocations
        timeout-minutes: 5
        run: |
          dotnet run --project tools/csharp-runner/PredatorIsle.Checks.csproj --no-build -- terrain-performance
      - name: Verify remaining runtime and authority without a graphical device
        timeout-minutes: 6
        run: |
          dotnet run --project tools/csharp-runner/PredatorIsle.Checks.csproj --no-build -- blob authority
      - name: Verify general scene and gameplay migration on a virtual display
        timeout-minutes: 6
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb libgl1-mesa-dri
          fi
          LIBGL_ALWAYS_SOFTWARE=1 PREDATOR_ISLE_TEST_DUMMY_AUDIO=1 xvfb-run -a \
            dotnet run --project tools/csharp-runner/PredatorIsle.Checks.csproj --no-build -- general
      - name: Verify Compatibility shaders and GPU/CPU numerical parity under Mesa
        timeout-minutes: 12
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb libgl1-mesa-dri
          fi
          LIBGL_ALWAYS_SOFTWARE=1 PREDATOR_ISLE_TEST_DUMMY_AUDIO=1 xvfb-run -a \
            dotnet run --project tools/csharp-runner/PredatorIsle.Checks.csproj --no-build -- \
              gpu-queues gpu-sampler gpu-vertex gpu-extension gpu-terrain
      - name: Upload diagnostic reports even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terrain-native-evidence
          if-no-files-found: ignore
          retention-days: 7
          path: |
            data/csharp_check_*_latest.json
            data/csharp_runner_latest.json
            .godot/csharp_checks/**/*.log
